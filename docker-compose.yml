version: '3.9'

services:
  api:
    build: ./api
    container_name: school_api
    # Temporarily override command to keep container alive
    # command: tail -f /dev/null
    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db


  frontend:
    build: ./frontend
    container_name: school_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: ["npm", "start"]

  db:
    image: postgres:15
    container_name: school_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
